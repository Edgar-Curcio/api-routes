# ✅ Kong Ingress Resource - Gerenciado via Argo CD (GitOps)
# Kong Ingress Controller lê isso e cria rotas automaticamente
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp
  namespace: api-routes
  annotations:
    kubernetes.io/ingress.class: kong
    konghq.com/strip-path: "true"
    konghq.com/preserve-host: "true"
    konghq.com/plugins: webapp-rate-limit
spec:
  rules:
  - host: api.edcurcio.com
    http:
      paths:
      - path: /webapp
        pathType: Prefix
        backend:
          service:
            name: webapp-chart
            namespace: webapp
            port:
              number: 5000

---
# Rate-limiting plugin aplicado via KongPlugin (CRD)
apiVersion: configuration.konghq.com/v1
kind: KongPlugin
metadata:
  name: webapp-rate-limit
  namespace: api-routes
plugin: rate-limiting
config:
  minute: 100
  policy: local
